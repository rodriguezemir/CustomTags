integrations:
  tab:
    hide-vanilla-nametags: true

display-tags:
  nametag:
    display:
      billboard: CENTER
      view-range: 32.0
      shadow-radius: 0.0
      shadow-strength: 1.0
      width: 1.0
      height: 1.0
      interpolation-duration: 0
      interpolation-delay: 0
      teleport-duration: 0
      glowing: false
      glow-color: "#FFD700"
      brightness:
        block: 15
        sky: 15
    text:
      line-width: 200
      background-color: "#00000000"
      text-opacity: 255
      default-background: false
      shadowed: true
      see-through: false
      alignment: CENTER
